<!DOCTYPE html>
<html>
<head>
  <title>Emit Example</title>
  <style>
    .box {
      width: 200px;
      height: 100px;
      background: lightblue;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="box" id="box">Click here  </div>

<script>
  // Create a custom event
  const event = new Event("boxClicked");

  // Listen to the custom event
  document.addEventListener("boxClicked", () => {
    alert("Event emitted successfully!");
  });

  // Emit the event when box is clicked
  document.getElementById("box").addEventListener("click", () => {
    document.dispatchEvent(event); // emit
  });
</script>

</body>
</html>
